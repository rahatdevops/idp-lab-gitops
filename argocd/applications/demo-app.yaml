apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  destination:
    namespace: demo-app
    server: https://kubernetes.default.svc

  project: default

  source:
    path: apps/demo-app
    repoURL: https://github.com/rahatdevops/idp-lab-gitops.git
    targetRevision: main
    directory:
      exclude: 'catalog-info.yaml'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
