apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-app
  namespace: demo-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: demo-app
      backstage.io/kubernetes-id: demo-app
  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
        - name: demo-app
          image: nginx:1.27

          ports:
            - containerPort: 80
